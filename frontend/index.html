<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NexaTel — Churn Risk Tool</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>NexaTel Retention — Churn Risk Check</h1>
    <p class="subtitle">Enter a customer's account details to get a live churn risk score.</p>

    <form id="churn-form">
      <div class="grid">
        <label>Tenure (months)
          <input type="number" name="tenure" value="12" min="0" required />
        </label>
        <label>Monthly Charges ($)
          <input type="number" step="0.01" name="monthly_charges" value="70" required />
        </label>
        <label>Total Charges ($)
          <input type="number" step="0.01" name="total_charges" value="840" required />
        </label>
        <label>Contract
          <select name="contract_ordinal">
            <option value="0">Month-to-month</option>
            <option value="1">One year</option>
            <option value="2">Two year</option>
          </select>
        </label>
        <label>Internet Service
          <select name="internet_service">
            <option value="DSL">DSL</option>
            <option value="Fiber optic">Fiber optic</option>
            <option value="No">No internet</option>
          </select>
        </label>
        <label>Tech Support
          <select name="tech_support">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </label>
        <label>Payment Method
          <select name="payment_method">
            <option value="Electronic check">Electronic check</option>
            <option value="Mailed check">Mailed check</option>
            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
            <option value="Credit card (automatic)">Credit card (automatic)</option>
          </select>
        </label>
        <label>Paperless Billing
          <select name="paperless_billing">
            <option value="1">Yes</option>
            <option value="0">No</option>
          </select>
        </label>
        <label>Senior Citizen
          <select name="senior_citizen">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>
        <label>Partner
          <select name="partner">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>
        <label>Dependents
          <select name="dependents">
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </label>
      </div>
      <button type="submit">Check Churn Risk</button>
    </form>

    <div id="result" class="result hidden">
      <h2>Result</h2>
      <p><strong>Risk Level:</strong> <span id="risk-level"></span></p>
      <p><strong>Churn Probability:</strong> <span id="risk-prob"></span></p>
      <div>
        <strong>Top reasons:</strong>
        <ul id="reasons-list"></ul>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
